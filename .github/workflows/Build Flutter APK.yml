name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # Memungkinkan trigger manual dari Termux

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'  # Ganti dengan versi Flutter Anda
          channel: 'stable'
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      # --- BUILD APK DEBUG ---
      - name: 🔨 Build APK Debug
        run: flutter build apk --debug

      - name: ⬆️ Upload APK Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      # --- BUILD APK RELEASE (SIGNED) ---
      - name: 🔐 Decode Keystore & Create key.properties
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=../app/upload-keystore.jks
          EOF

      - name: 🛠️ Build APK Release (Signed)
        if: github.event_name != 'pull_request'
        run: flutter build apk --release

      - name: ⬆️ Upload APK Release Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
